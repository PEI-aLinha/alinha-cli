[project]
name = "alinha-cli"
version = "0.1.0"
description = "Development tooling for the aLinha platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12", "pyyaml>=6", "packaging>=24"]

[project.scripts]
alinha = "alinha_cli.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alinha_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov=alinha_cli --cov-report=term-missing"

[tool.ruff]
line-length = 100
